<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kelompok 6 - study plant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header Colorful -->
        <header class="bg-gradient-to-r from-violet-600 via-fuchsia-600 to-pink-600 text-white p-6 sm:p-8 rounded-3xl shadow-xl mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span class="bg-white/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Tugas Algoritma & Pemrograman</span>
                <h1 class="text-3xl font-extrabold mt-2">📚 study plant</h1>
                <p class="text-pink-100 text-sm mt-1">Aplikasi Pengatur Jadwal Pintar</p>
            </div>
            <div class="bg-white/10 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/20 text-right">
                <p class="text-xs text-pink-100">Total Tugas Aktif</p>
                <p id="totalTasksCount" class="text-2xl font-bold">5</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Input Tugas -->
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-xl border border-white h-fit">
                <h2 class="text-lg font-bold mb-4 text-violet-700 flex items-center gap-2">
                    <span>✨</span> Tambah Tugas Baru
                </h2>
                <form id="taskForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Tugas</label>
                        <input type="text" id="name" placeholder="Misal: Pemrograman Web" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Deadline (Hari ke-)</label>
                        <input type="number" id="deadline" placeholder="Contoh: 3" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Prioritas</label>
                        <select id="priority" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 transition">
                            <option value="1">🔴 1 - Tinggi (Urgent)</option>
                            <option value="2">🟡 2 - Sedang</option>
                            <option value="3">🟢 3 - Rendah (Santai)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Mulai (0-23)</label>
                            <input type="number" id="startTime" min="0" max="23" placeholder="08" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Selesai (0-23)</label>
                            <input type="number" id="endTime" min="0" max="23" placeholder="10" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 transition">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-violet-500/30">Simpan Tugas</button>
                </form>

                <!-- Menu Pencarian Binary Search -->
                <div class="mt-8 pt-6 border-t border-slate-100">
                    <h3 class="text-sm font-bold mb-2 text-slate-700 flex items-center gap-2">
                        <span>🔍</span> Binary Search Deadline
                    </h3>
                    <div class="flex gap-2">
                        <input type="number" id="searchDeadline" placeholder="Cari hari ke-" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
                        <button onclick="handleBinarySearch()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow">Cari</button>
                    </div>
                    <div id="searchResult" class="mt-2 text-xs font-medium text-slate-600"></div>
                </div>
            </div>

            <!-- Bagian Tampilan Data & Tombol Algoritma -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white/80 backdrop-blur-md p-4 rounded-3xl shadow-xl border border-white flex flex-wrap gap-3">
                    <button onclick="renderTasks()" class="flex-1 min-w-[120px] bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-3 rounded-2xl transition shadow-sm">📋 Semua Tugas</button>
                    <button onclick="handleMergeSort()" class="flex-1 min-w-[140px] bg-gradient-to-r from-emerald-500 to-teal-600 text-white text-xs font-bold px-4 py-3 rounded-2xl transition shadow-md">⚡ Merge Sort</button>
                    <button onclick="handleGreedy()" class="flex-1 min-w-[140px] bg-gradient-to-r from-amber-500 to-orange-600 text-white text-xs font-bold px-4 py-3 rounded-2xl transition shadow-md">🎯 Greedy Optimal</button>
                </div>

                <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-xl border border-white">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="sectionTitle" class="text-lg font-bold text-slate-800">📋 Daftar Tugas</h2>
                        <span class="text-xs bg-violet-100 text-violet-700 font-bold px-3 py-1 rounded-full">Live View</span>
                    </div>
                    <div id="taskListContainer" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logika & Algoritma -->
    <script>
        let tasks = [
            { id: 1, name: "Matematika Diskrit", deadline: 3, priority: 2, startTime: 8, endTime: 10, completed: false },
            { id: 2, name: "Struktur Data", deadline: 1, priority: 1, startTime: 9, endTime: 11, completed: false },
            { id: 3, name: "Pemrograman Web", deadline: 2, priority: 1, startTime: 13, endTime: 15, completed: false },
            { id: 4, name: "Pancasila", deadline: 5, priority: 3, startTime: 10, endTime: 12, completed: false },
            { id: 5, name: "Basis Data", deadline: 1, priority: 2, startTime: 14, endTime: 16, completed: false }
        ];
        let nextId = 6;

        // 1. MERGE SORT
        function mergeSort(arr) {
            if (arr.length <= 1) return arr;
            const mid = Math.floor(arr.length / 2);
            const left = mergeSort(arr.slice(0, mid));
            const right = mergeSort(arr.slice(mid));
            return merge(left, right);
        }

        function merge(left, right) {
            let sorted = [];
            let i = 0, j = 0;
            while (i < left.length && j < right.length) {
                if (left[i].deadline < right[j].deadline || 
                   (left[i].deadline === right[j].deadline && left[i].priority < right[j].priority)) {
                    sorted.push(left[i]);
                    i++;
                } else {
                    sorted.push(right[j]);
                    j++;
                }
            }
            return sorted.concat(left.slice(i)).concat(right.slice(j));
        }

        // 2. GREEDY SCHEDULING
        function greedyScheduling(taskList) {
            let activeTasks = taskList.filter(t => !t.completed);
            if (activeTasks.length === 0) return [];
            let sorted = [...activeTasks].sort((a, b) => a.endTime - b.endTime);
            let selected = [sorted[0]];
            let lastEndTime = sorted[0].endTime;

            for (let i = 1; i < sorted.length; i++) {
                if (sorted[i].startTime >= lastEndTime) {
                    selected.push(sorted[i]);
                    lastEndTime = sorted[i].endTime;
                }
            }
            return selected;
        }

        // 3. BINARY SEARCH
        function binarySearch(sortedArr, target) {
            let low = 0, high = sortedArr.length - 1;
            while (low <= high) {
                let mid = Math.floor((low + high) / 2);
                if (sortedArr[mid].deadline === target) {
                    let left = mid, right = mid;
                    while (left >= 0 && sortedArr[left].deadline === target) left--;
                    while (right < sortedArr.length && sortedArr[right].deadline === target) right++;
                    return sortedArr.slice(left + 1, right);
                } else if (sortedArr[mid].deadline < target) {
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }
            return [];
        }

        // TOGGLE STATUS SELESAI
        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                renderTasks();
            }
        }

        // HAPUS TUGAS
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        // UI RENDERER
        function renderTasks(customList = null, title = "📋 Daftar Tugas") {
            // Jika customList kosong/null, ambil semua tugas yang belum selesai (atau semua)
            let displayList = customList !== null ? customList : tasks;
            
            document.getElementById("sectionTitle").innerText = title;
            let activeCount = tasks.filter(t => !t.completed).length;
            document.getElementById("totalTasksCount").innerText = activeCount;
            
            const container = document.getElementById("taskListContainer");
            container.innerHTML = "";

            if (displayList.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm italic">Tidak ada data tugas.</div>`;
                return;
            }

            displayList.forEach((t, idx) => {
                let badgeColor = 'bg-rose-100 text-rose-700 border-rose-200';
                let textPriority = 'Tinggi';
                if (t.priority === 2) {
                    badgeColor = 'bg-amber-100 text-amber-700 border-amber-200';
                    textPriority = 'Sedang';
                } else if (t.priority === 3) {
                    badgeColor = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    textPriority = 'Rendah';
                }

                let cardStyle = t.completed ? "bg-slate-100 border-slate-200 opacity-60" : "bg-gradient-to-r from-slate-50 to-white border-slate-100";
                let textStyle = t.completed ? "line-through text-slate-400" : "text-slate-800";

                const card = `
                    <div class="p-4 rounded-2xl border ${cardStyle} shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition">
                        <div class="flex items-start gap-3">
                            <span class="w-8 h-8 rounded-xl bg-violet-100 text-violet-700 font-bold flex items-center justify-center text-xs flex-shrink-0">#${idx + 1}</span>
                            <div>
                                <h3 class="font-bold text-sm sm:text-base ${textStyle}">${t.name}</h3>
                                <p class="text-xs text-slate-500 mt-0.5">⏰ Pukul ${t.startTime}:00 - ${t.endTime}:00 | 📅 Deadline: Hari ke-${t.deadline}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                            <span class="text-xs px-2.5 py-1 rounded-lg font-bold border ${badgeColor}">${textPriority}</span>
                            <button onclick="toggleComplete(${t.id})" class="text-xs px-3 py-1.5 rounded-xl font-bold ${t.completed ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'} transition">
                                ${t.completed ? 'Batal' : '✓ Selesai'}
                            </button>
                            <button onclick="deleteTask(${t.id})" class="text-xs px-2.5 py-1.5 rounded-xl font-bold bg-rose-100 text-rose-700 hover:bg-rose-200 transition">
                                🗑️
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        document.getElementById("taskForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const deadline = parseInt(document.getElementById("deadline").value);
            const priority = parseInt(document.getElementById("priority").value);
            const startTime = parseInt(document.getElementById("startTime").value);
            const endTime = parseInt(document.getElementById("endTime").value);

            tasks.push({ id: nextId++, name, deadline, priority, startTime, endTime, completed: false });
            renderTasks(null, "📋 Daftar Tugas");
            this.reset();
            alert("Berhasil menambahkan tugas baru!");
        });

        function handleMergeSort() {
            let sorted = mergeSort([...tasks]);
            renderTasks(sorted, "⚡ Hasil Merge Sort (Urut Deadline & Prioritas)");
        }

        function handleGreedy() {
            let optimal = greedyScheduling(tasks);
            renderTasks(optimal, "🎯 Jadwal Belajar Optimal (Greedy Interval Scheduling)");
        }

        function handleBinarySearch() {
            const target = parseInt(document.getElementById("searchDeadline").value);
            const resContainer = document.getElementById("searchResult");
            if (isNaN(target)) {
                resContainer.innerHTML = "Masukkan angka deadline yang valid!";
                return;
            }
            let sorted = mergeSort([...tasks]);
            let results = binarySearch(sorted, target);

            if (results.length > 0) {
                resContainer.innerHTML = `<span class="text-emerald-600 font-bold">Ditemukan ${results.length} tugas pada H-${target}!</span>`;
                renderTasks(results, `🔍 Hasil Pencarian Deadline Hari ke-${target}`);
            } else {
                resContainer.innerHTML = `<span class="text-rose-500 font-bold">Tidak ada tugas pada hari ke-${target}.</span>`;
            }
        }

        renderTasks();
    </script>
</body>
</html>
